plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.deepgaze'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Spring Boot core (WebFlux for non-blocking REST + SSE) ---
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Security: stateless JWT auth for the /api/** surface ---
    // spring-boot-starter-security picks the reactive flavour automatically
    // when spring-boot-starter-webflux is on the classpath.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- Connection pooling (HikariCP is bundled with spring-boot-starter-jdbc) ---
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // --- MyBatis (data-access for collector queries). We exclude
    // MybatisAutoConfiguration in DeepGazeApplication and build one
    // SqlSessionFactory PER TARGET in MyBatisFactoryRegistry — the starter
    // assumes one DataSource, but we run N pools (one per monitored DB).
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // --- JDBC drivers for each target DB ---
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.5.0.24.07'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'

    // --- Embedded history store (V9 Time Machine) ---
    // Pure-Java SQLite driver (xerial), WAL mode for concurrent reads while
    // the writer thread batches inserts. One .db file at deepgaze.history.db-path.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'

    // --- Reactive / async helpers ---
    implementation 'io.projectreactor:reactor-core'

    // --- OS / hardware metrics (CPU iowait, memory+swap, per-disk I/O).
    // Pure Java + JNA; no native agent needed. Used by HostMetricsCollector
    // to fuel the Infrastructure Hub tile on the dashboard. Observes the
    // BACKEND host — useful for co-located monitoring or as the baseline
    // read on the process running the collectors.
    implementation 'com.github.oshi:oshi-core:6.6.5'

    // --- JSON & YAML config binding ---
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    // --- Logging ---
    implementation 'org.slf4j:slf4j-api'

    // --- Lombok (compile-time, optional but reduces boilerplate) ---
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // --- Tests ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'deepgaze-backend.jar'
}

# DeepGaze frontend — static SPA + SSE-aware reverse proxy.
#
# Everything under /api/ is forwarded to the backend service via the compose
# network. The /api/stream/* endpoints are Server-Sent Events — a long-lived,
# chunked text/event-stream response. Nginx MUST NOT buffer that, or the
# browser won't see frames until either the proxy buffer fills or the upstream
# closes. The dedicated `^~ /api/stream/` block disables buffering and bumps
# read/send timeouts to 1h so the SSE fan-out behaves like a native long-poll.

upstream deepgaze_backend {
    server        backend:8080;
    keepalive     32;
}

server {
    listen       80;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # --- SSE reverse proxy. `^~` makes this the preferred prefix match so
    # nginx never falls through to the generic /api/ block below for streams.
    location ^~ /api/stream/ {
        proxy_pass                http://deepgaze_backend;
        proxy_http_version        1.1;
        proxy_set_header          Host              $host;
        proxy_set_header          X-Real-IP         $remote_addr;
        proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $scheme;
        proxy_set_header          Connection        "";

        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        1h;
        proxy_send_timeout        1h;
        chunked_transfer_encoding on;
        add_header                X-Accel-Buffering no always;
    }

    # --- Normal REST — buffered, keepalive'd upstream.
    location /api/ {
        proxy_pass         http://deepgaze_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Hashed Vite assets (JS, CSS, images) are immutable — cache hard.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # --- SPA fallback so deep links (/?targetId=..., /replay, etc.) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html should never be stale; the browser revalidates every load so
    # a deploy is picked up on the next navigation.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    # --- Modest gzip. Big JS bundles are already hash-immutable and long-cached.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml;
}
